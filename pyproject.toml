[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blackjack-grpo"
version = "0.1.0"
description = "Local LoRA GRPO experiment for infinite-deck blackjack"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.14.0",
  "transformers==5.17.0",
  "trl==1.13.0",
  "accelerate==1.15.0",
  "datasets==5.0.1",
  "peft>=0.17.0",
  "gymnasium>=1.2.0",
]

[project.scripts]
blackjack-grpo = "blackjack_grpo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/blackjack_grpo"]
